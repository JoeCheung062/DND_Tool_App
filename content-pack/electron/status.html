<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DND Content</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background: #0b1016;
        color: #e8eef6;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 400px at 10% -10%, rgba(61, 214, 198, 0.18), transparent 55%),
          #0b1016;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-weight: 650;
        letter-spacing: -0.03em;
        margin: 0 0 0.6rem;
      }
      p {
        line-height: 1.5;
        color: #9aabbd;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1.15rem;
        background: #3dd6c6;
        color: #04221f;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        margin-top: 1.25rem;
        padding: 1rem 1.1rem;
        border: 1px solid rgba(232, 238, 246, 0.12);
        border-radius: 12px;
        background: rgba(20, 28, 38, 0.9);
        color: #e8eef6;
      }
      .status.error {
        border-color: rgba(255, 123, 114, 0.45);
      }
      .status.ready {
        border-color: rgba(61, 214, 198, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <p>DND Content</p>
      <h1>Import the library into DND Server</h1>
      <p>
        This adds the packed rooms, campaigns, tags, materials, and combinations to the
        DND Server already installed on this computer. Accounts already on that server stay as they are.
      </p>
      <button id="import" type="button" disabled>Import</button>
      <div id="status" class="status">Checking DND Server…</div>
    </main>
    <script>
      const status = document.getElementById("status");
      const button = document.getElementById("import");
      function show(result) {
        status.textContent = result.message;
        status.className = "status " + (result.ok ? "ready" : "error");
        button.disabled = !result.ok;
      }
      window.contentHost.inspect().then(show);
      button.addEventListener("click", async () => {
        button.disabled = true;
        status.className = "status";
        status.textContent = "Importing…";
        try {
          show(await window.contentHost.importContent());
        } catch (error) {
          show({ ok: false, message: error instanceof Error ? error.message : "Import failed." });
        }
      });
    </script>
  </body>
</html>
