services:
  postgres:
    image: postgres:16-alpine
    container_name: dnd-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnd_app
    ports:
      - "5432:5432"
    volumes:
      - dnd_pg_data:/var/lib/postgresql/data

volumes:
  dnd_pg_data:
